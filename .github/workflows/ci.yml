name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            symfony: '6.4.*'
            dependencies: highest
          - php: '8.1'
            symfony: '6.4.*'
            dependencies: lowest
          - php: '8.2'
            symfony: '7.4.*'
            dependencies: highest
          - php: '8.3'
            symfony: '7.4.*'
            dependencies: highest
          - php: '8.4'
            symfony: '8.1.*'
            dependencies: highest
          - php: '8.5'
            symfony: '8.1.*'
            dependencies: highest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Select Symfony version
        env:
          SYMFONY_VERSION: ${{ matrix.symfony }}
        run: >-
          composer require --no-update
          "symfony/config:$SYMFONY_VERSION"
          "symfony/dependency-injection:$SYMFONY_VERSION"
          "symfony/event-dispatcher:$SYMFONY_VERSION"
          "symfony/http-foundation:$SYMFONY_VERSION"
          "symfony/http-kernel:$SYMFONY_VERSION"
          "symfony/security-csrf:$SYMFONY_VERSION"
          && composer require --dev --no-update "symfony/framework-bundle:$SYMFONY_VERSION"
      - name: Install dependencies
        env:
          DEPENDENCIES: ${{ matrix.dependencies }}
        run: |
          if [ "$DEPENDENCIES" = lowest ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist
          else
            composer update --no-interaction --prefer-dist
          fi
      - run: composer check
      - run: composer audit
